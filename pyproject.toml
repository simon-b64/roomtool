[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roomtool"
version = "0.1.0"
description = "Analyze a measured room impulse response (REW export) and use it to reduce reverberation in recordings by a chosen dB amount"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
wpe = ["nara-wpe>=0.0.9"]
test = ["pytest>=8"]

[project.scripts]
roomtool = "roomtool.cli:main"

[tool.setuptools.packages.find]
include = ["roomtool*"]
